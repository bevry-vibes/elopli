[workspace]
resolver = "3"
members = [
	"crates/elopli-core",
	"crates/elopli-session",
	"crates/elopli",
	"crates/elopli-ffi",
	"crates/uniffi-bindgen",
	"apps/windows/Elopli",
	"apps/linux/Elopli",
]

[workspace.package]
# Single version source: the app build scripts read this value.
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "RPL-1.5"
authors = ["Benjamin Lupton <b@lupton.cc>"]
repository = "https://github.com/bevry-vibes/elopli"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2.12", default-features = false }
clap = { version = "4", features = ["derive"] }
rayon = "1"
dirs = "7"
mdns-sd = { version = "0.22", default-features = false }
uniffi = "0.32"

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
