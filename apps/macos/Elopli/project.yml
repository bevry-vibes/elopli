name: Elopli
options:
  bundleIdPrefix: com.bevry
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Elopli:
    type: application
    platform: macOS
    sources:
      - path: Elopli
      - path: Generated/elopli_ffi.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bevry.elopli
        PRODUCT_NAME: Elopli
        INFOPLIST_FILE: Elopli/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS:
          - $(SRCROOT)/Generated/FFI
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Generated/FFI
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/Generated/FFI
        OTHER_SWIFT_FLAGS:
          - $(inherited)
          - -Xcc
          - -fmodule-map-file=$(SRCROOT)/Generated/FFI/module.modulemap
        OTHER_LDFLAGS:
          - -lelopli_ffi
          - -liconv
          - -lresolv
      configs:
        Debug:
          ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - framework: AppIntents.framework
        embed: false
      - framework: ServiceManagement.framework
        embed: false

schemes:
  Elopli:
    build:
      targets:
        Elopli: all
    run:
      config: Debug

