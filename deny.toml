[advisories]
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
allow = [
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"MPL-2.0",
	"Unicode-3.0",
	"Unlicense",
	"RPL-1.5",
	"LGPL-2.1-or-later",
]
confidence-threshold = 0.8
exceptions = [
	{ allow = ["MIT", "Apache-2.0"], crate = "flume" },
	{ allow = ["MIT", "Apache-2.0"], crate = "minimal-lexical" },
	{ allow = ["MIT", "Apache-2.0"], crate = "plain" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
