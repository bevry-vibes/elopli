name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --workspace --release --locked

  cross-check:
    name: cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked --target x86_64-unknown-linux-gnu
      - run: cargo check --workspace --locked --target x86_64-pc-windows-gnu

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

  deny:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  windows-app:
    name: windows-app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p elopli-app --features windows --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p elopli-app --features windows --locked
      - name: Smoke test
        run: cargo run -p elopli-app --features windows --locked -- --smoke-test
      - name: Package
        run: pwsh -NoProfile -File scripts/build-windows.ps1
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: windows-app
          path: |
            dist/Elopli-*-windows-x64.zip
            dist/SHA256SUMS
            dist/elopli.json
          if-no-files-found: error

  linux-app:
    name: linux-app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GTK4 and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev desktop-file-utils appstream
      - name: Clippy
        run: cargo clippy -p elopli-app-linux --features linux --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p elopli-app-linux --features linux --locked
      - name: Smoke test
        run: cargo run -p elopli-app-linux --features linux --locked -- --smoke-test
      - name: Package
        run: ./scripts/build-linux.sh
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: linux-app
          path: |
            dist/Elopli-*-linux-x86_64.tar.gz
            dist/Elopli-*-linux-x86_64/SHA256SUMS
          if-no-files-found: error

  macos-app:
    name: macos-app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - run: ./scripts/build-macos.sh
        env:
          CODE_SIGNING_ALLOWED: NO
